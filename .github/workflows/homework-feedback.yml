name: homework-feedback

on:
  workflow_run:
    workflows:
    - calculate
    - fibonacci
    - nwd-nnw
    - add-even
    - max-of-vector
    - generate-sequence
    - password-check
    - vector-of-shared-ptrs
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const run = context.payload.workflow_run;
          const task = run.name;

          let prNumber = run.pull_requests[0]?.number;
          if (!prNumber) {
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            prNumber = prs.find((pr) => pr.head.sha === run.head_sha)?.number;
          }
          if (!prNumber) {
            core.info(`No open PR for ${run.head_sha}`);
            return;
          }

          const kind = run.conclusion;
          const marker = `<!-- homework-feedback:${kind} -->`;
          const bodies = {
            success: [
              marker,
              '✅ Testy przechodzą – zadanie zaliczone!',
              '',
              'Punkty zobaczysz w kokpicie: zaloguj się na https://kokpit.coders.school/ tym samym kontem GitHub, z którego wysyłasz ten PR. Konto na platformie kursów nie jest potrzebne.',
            ],
            failure: [
              marker,
              '❌ Jeszcze nie wszystko działa – spokojnie, to normalne przy pierwszym podejściu.',
              '',
              '- Na dole PR-a kliknij **Details** przy czerwonym sprawdzeniu – zobaczysz, co dokładnie nie przeszło.',
              `- Jeśli na czerwono jest tylko \`formatting_check\`, kod działa, a poprawić trzeba formatowanie: \`clang-format -i homework/${task}/*.cpp homework/${task}/*.hpp\` (albo popraw wcięcia ręcznie według logu).`,
              '- Każdy kolejny push do tej gałęzi sprawdza zadanie od nowa – nie musisz zakładać nowego PR-a. Gdy testy przejdą, napiszę tu jeszcze raz.',
            ],
          };

          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          if (comments.some((c) => c.body?.includes(marker))) {
            core.info(`PR #${prNumber} already has the ${kind} comment`);
            return;
          }
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: prNumber,
            body: bodies[kind].join('\n'),
          });
          core.info(`Commented ${kind} on PR #${prNumber}`);
