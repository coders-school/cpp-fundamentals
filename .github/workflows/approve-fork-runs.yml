name: approve-fork-runs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
    - calculate
    - fibonacci
    - nwd-nnw
    - add-even
    - max-of-vector
    - generate-sequence
    - password-check
    - vector-of-shared-ptrs

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  approve:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.ACTIONS_APPROVER_TOKEN || github.token }}
        script: |
          const pr = context.payload.pull_request;
          const files = await github.paginate(github.rest.pulls.listFiles, {
            ...context.repo,
            pull_number: pr.number,
            per_page: 100,
          });
          const protectedPath = /^\.(github|devcontainer)\//;
          const touched = files
            .flatMap((f) => [f.filename, f.previous_filename])
            .filter((name) => name && protectedPath.test(name));
          if (touched.length) {
            core.notice(`Manual approval needed, PR changes: ${touched.join(', ')}`);
            return;
          }

          const approved = new Set();
          for (let attempt = 0; attempt < 6; attempt++) {
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,
              head_sha: pr.head.sha,
              status: 'action_required',
            });
            const pending = data.workflow_runs.filter((run) => !approved.has(run.id));
            for (const run of pending) {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve', {
                ...context.repo,
                run_id: run.id,
              });
              approved.add(run.id);
              core.info(`Approved ${run.name} (${run.html_url})`);
            }
            if (approved.size && !pending.length) break;
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          core.info(`Approved runs: ${approved.size}`);
